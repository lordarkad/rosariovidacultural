name: Deploy

# Staging only. Production is a SEPARATE workflow (deploy-production.yml), triggered manually via
# workflow_dispatch — nothing reaches production automatically.
#
# Dos disparadores:
#   - workflow_run: tras CI verde en main, despliega solo lo que cambió (filtro de paths contra el commit padre).
#   - workflow_dispatch: a mano desde Actions, despliega TODO (api + dashboard) sin filtro de paths. Sirve para
#     el primer deploy, para re-correr uno fallido, o cuando un merge no tocó apps/ y el filtro lo saltó.
#
# Thin caller: deploy/migrate/verify logic lives in the playbook's reusable workflow
# (post-merge-deploy.yml). Requiere squash-merge-only + branch protection en main (ver
# tracks/app/00-playbook.md y la nota del skill /new-track-app).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA o rama a desplegar a staging (por defecto main)"
        required: false
        default: main

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      # A mano no hay commit base contra el cual comparar: se despliega todo.
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
      dashboard: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.dashboard }}
    steps:
      - if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - if: ${{ github.event_name == 'workflow_run' }}
        id: parent
        run: echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
      - if: ${{ github.event_name == 'workflow_run' }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.parent.outputs.sha }}
          filters: |
            api:
              - 'apps/api/**'
            dashboard:
              - 'apps/dashboard/**'

  deploy-staging:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: Triptongo/triptongo-ci-shared/.github/workflows/post-merge-deploy.yml@main
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      deploy_api: ${{ needs.changes.outputs.api == 'true' }}
      deploy_dashboard: ${{ needs.changes.outputs.dashboard == 'true' }}
      d1_database_name: "rosariovidacultural-db-staging"
      api_health_url: "https://rosariovidacultural-api-staging.dry-brook-7eef.workers.dev/api/health"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
