name: Actualizar agenda

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 hora de Rosario (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # tope de costo/cuelgue (ADR 0002)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - run: pip install -r ingestion/requirements.txt
      - run: python -m unittest discover -s ingestion/tests
      - run: python ingestion/build.py
      - name: Lugares (OpenStreetMap)
        run: python ingestion/build_places.py
        continue-on-error: true  # el servidor público de Overpass falla seguido: se conserva el archivo anterior
      - name: Publicar events.json
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add ingestion/site ingestion/data/geocache.json
          git diff --staged --quiet || git commit -m "chore: actualizar agenda"
          git push
