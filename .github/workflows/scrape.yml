name: Actualizar agenda

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 hora de Rosario (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python build.py
      - name: Lugares (OpenStreetMap)
        run: python build_places.py
        continue-on-error: true  # el servidor público de Overpass falla seguido: se conserva el archivo anterior
      - name: Publicar events.json
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add site/events.json site/news.json site/venues.json site/places.json data/geocache.json
          git diff --staged --quiet || git commit -m "chore: actualizar agenda"
          git push
