name: Actualizar agenda

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 hora de Rosario (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

# Los dos workflows de datos (este y «Actualizar lugares») commitean a main: se hacen de a uno.
concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # tope de costo/cuelgue (ADR 0002); los eventos tardan ~8 min, los lugares van en su propio workflow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # la última versión: el otro workflow pudo haber commiteado mientras esperaba su turno
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt
      - run: pip install -r ingestion/requirements.txt
      - run: python -m unittest discover -s tests
        working-directory: ingestion
      - run: python ingestion/build.py
      - name: Publicar a la API (staging)
        run: python ingestion/publish.py --skip-osm  # eventos y espacios curados; los lugares de OpenStreetMap, 1 vez por semana
        continue-on-error: true  # un fallo de la API no frena la actualización del sitio legacy
        env:
          INGEST_URL: https://rosariovidacultural-api-staging.dry-brook-7eef.workers.dev/api/ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN_STAGING }}
      - name: Publicar events.json
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add ingestion/site ingestion/data/geocache.json
          git diff --staged --quiet || git commit -m "chore: actualizar agenda"
          git pull --rebase origin main
          git push
