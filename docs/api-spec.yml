openapi: 3.1.0
info:
  title: "rosariovidacultural API"
  version: 0.2.0
  description: "Agregador de planes en Rosario (eventos, espacios, lugares): sitio público + panel admin."

servers:
  - url: /api

tags:
  - name: system
  - name: catalog
    description: Zonas, eventos y lugares
  - name: search
    description: Búsqueda para el sitio público
  - name: curation
    description: Listados completos de eventos y lugares para revisar la ingesta (sin filtros de intención ni ubicación)
  - name: ingest
    description: Ingesta desde `ingestion/` (autenticada)

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [system]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/HealthData"
        "500":
          $ref: "#/components/responses/ServerError"

  /zones:
    get:
      operationId: listZones
      summary: Zonas predefinidas (barrios y localidades) con centro y radio
      description: Lista fija (B-6). Sin paginación, son pocas y se cachean en el cliente.
      tags: [catalog]
      security: []
      responses:
        "200":
          description: Lista de zonas
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Zone"
        "500":
          $ref: "#/components/responses/ServerError"

  /search:
    get:
      operationId: searchItems
      summary: Buscar eventos y lugares (lista agrupada por franja)
      description: |
        Búsqueda en el servidor (B-5). Devuelve eventos y lugares mezclados, ordenados por franja horaria y,
        dentro de cada franja, por distancia al origen (B-9). Sin origen (`z` ni `lat`/`lon`) busca en toda
        la ciudad, sin distancia, y ordena por horario.

        Origen: `z` (zona, usa su propio radio, E-8) **o** `lat`+`lon` (radio `radio_m`, 500 a 10000, default 2000).
        `z` y `lat`/`lon` a la vez es un 400, igual que `lat` sin `lon`, o `cuando=fecha` sin `fecha`.
        Un `z` que no existe es 404. Las coordenadas no se guardan ni se loguean (D-9).
        Con origen (`z` o `lat`+`lon`) solo entran ítems con ubicación dentro del radio: los `location_known = false`
        no se pueden ubicar y quedan afuera. Sin origen entran todos, y los sin ubicación van al final de su franja (E-1).

        Paginación (D-7): el envelope obliga a que `data` sea el array, así que el total viaja en los headers
        `X-Total-Count`, `X-Page` y `X-Per-Page`.

        **Día y ventanas (E-5).** Todo se calcula en `America/Argentina/Buenos_Aires`. El «día» va de las 06:00 a las
        06:00 del siguiente: un evento a las 00:30 de D+1 pertenece al día D y solo a ese (nunca se cuenta dos veces).
        - «Hoy» es siempre el día de negocio (06:00 a 06:00): el lunes a las 02:00 todavía es domingo.
        - `ahora`: eventos con horario que empezaron hace hasta 2 h o empiezan en la próxima hora, y lugares con `open_now = true`.
        - `hoy`: el resto del día actual. `manana`: el día siguiente. `fecha`: el día indicado.
        - `finde`: de `max(viernes 18:00, ahora)` hasta el lunes 06:00 siguiente. Entre el viernes 18:00 y el lunes 06:00
          es el fin de semana en curso; el resto de la semana, el próximo (de lunes 06:00 a viernes 18:00 la ventana
          es el viernes 18:00 próximo, así que nunca está vacía por el calendario). La tolerancia de 2 h hacia atrás es solo para
          eventos; un lugar que ya cerró no cuenta por haber estado abierto antes de `ahora`.

        **Franja (`band`).** Depende de cuándo ocurre el ítem por primera vez dentro de la ventana, no del valor de `cuando`.
        Se evalúa en este orden:
        1. Evento con rango de más de 7 días (días inclusivos: `end_date - start_date + 1 > 7`): `en_cartel`, con o sin
           horario (E-3). Aparece en toda ventana que su rango superponga, salvo `ahora`.
        2. Evento sin `start_time`: `a_confirmar`. Aparece solo con `cuando=hoy` o `finde`; nunca con `ahora`, `manana` ni `fecha` (E-4).
        3. El resto, por día y hora de su primera ocurrencia: hoy entre 06:00 y 20:00 es `hoy`, hoy desde las 20:00 es
           `esta_noche`, o `ahora` si cumple la definición de arriba; mañana es `manana`; después, `proximos`.
           Con un rango de 2 a 7 días, `start_time` se repite cada día del rango; la primera ocurrencia es la
           primera de esas con inicio mayor o igual a `ahora` menos 2 h dentro de la ventana. Una ocurrencia de hoy
           que empezó hace más de 2 h no cuenta, y si era la última del rango el evento no aparece.
        4. Lugares: aparecen si están abiertos en algún momento de la ventana (a partir de `ahora`). **`ahora` si y
           solo si `open_now = true` y la ventana incluye el momento actual (`ahora`, `hoy`, o `finde` ya empezado).** Si no, toman `hoy` o `esta_noche` según su hora de apertura, aunque abran
           dentro de la próxima hora; `manana` o `proximos` según el día de su primera apertura. Sin `opening_hours`:
           `a_confirmar`, con las mismas ventanas que un evento sin horario. Un lugar que ya cerró por hoy no aparece en `hoy`.

        **Orden.** Por `band` (`ahora`, `hoy`, `esta_noche`, `manana`, `proximos`, `en_cartel`, `a_confirmar`) y, dentro de
        cada franja: (1) ítems con ubicación antes que los sin ubicación (E-1); (2) con `i`, más intenciones
        coincidentes primero (E-7); (3) `distance_m` ascendente; (4) hora de inicio ascendente (evento: su primera
        ocurrencia en la ventana; lugar: su primer momento abierto; en `en_cartel`, su `start_time` como hora del día;
        sin hora al final); (5) título o nombre
        normalizado; (6) `id` ascendente como desempate final, para que la paginación sea estable (B-9). Sin origen
        el paso (3) no discrimina y sigue (4).

        Eventos y lugares se comparan con la misma clave. Los eventos que dejan de verse vencen (E-9); los lugares no.

        Vencimiento (E-9, solo eventos): un evento sin verse hace más de 7 días no aparece.
      tags: [search]
      security: []
      parameters:
        - $ref: "#/components/parameters/Intents"
        - $ref: "#/components/parameters/MusicGenres"
        - $ref: "#/components/parameters/Gratis"
        - $ref: "#/components/parameters/Cuando"
        - $ref: "#/components/parameters/Fecha"
        - $ref: "#/components/parameters/Zona"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadioM"
        - $ref: "#/components/parameters/TextoLibre"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de resultados
          headers:
            X-Total-Count:
              description: Total de resultados que cumplen los filtros (todas las páginas)
              schema: { type: integer, minimum: 0 }
            X-Page:
              schema: { type: integer, minimum: 1 }
            X-Per-Page:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /search/pins:
    get:
      operationId: searchPins
      summary: Pins para el mapa, con los mismos filtros que /search
      description: |
        Mismos filtros y mismas validaciones que `searchItems`, sin paginación. Devuelve como máximo 100 pins
        (D-7), en el mismo orden que la lista. Si hay más, `X-Truncated: true` y el cliente acota con `bbox`
        al mover o hacer zoom en el mapa. Solo incluye ítems con coordenadas (los eventos sin ubicación, E-1,
        no tienen pin).
      tags: [search]
      security: []
      parameters:
        - $ref: "#/components/parameters/Intents"
        - $ref: "#/components/parameters/MusicGenres"
        - $ref: "#/components/parameters/Gratis"
        - $ref: "#/components/parameters/Cuando"
        - $ref: "#/components/parameters/Fecha"
        - $ref: "#/components/parameters/Zona"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadioM"
        - $ref: "#/components/parameters/TextoLibre"
        - name: bbox
          in: query
          description: "Recuadro visible del mapa: `min_lon,min_lat,max_lon,max_lat`. Con min mayor que max es 400."
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$'
      responses:
        "200":
          description: Pins (máximo 100)
          headers:
            X-Total-Count:
              description: Total de ítems con coordenadas que cumplen los filtros y caen dentro de `bbox` (si se envía)
              schema: { type: integer, minimum: 0 }
            X-Truncated:
              description: "`true` si hay más pins de los devueltos"
              schema: { type: boolean }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/SearchPin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /events:
    get:
      operationId: listEvents
      summary: Listado completo de eventos para curación (vigentes y pasados)
      description: |
        Alimenta `/curacion/eventos` del sitio (revisar la ingesta con un equipo de voluntarios). **No es la búsqueda**:
        no filtra por intención, ventana ni ubicación, y **incluye los eventos pasados y los vencidos**, que `searchItems`
        y `getEvent` ocultan. Sin autenticación, datos ya públicos. Solo lectura.

        **Estado (`estado`).** Se calcula en `America/Argentina/Buenos_Aires` con el día de negocio de `searchItems`
        (de 06:00 a 06:00) y se evalúa en este orden:
        1. `sin_ver`: `last_seen_at` de hace más de 7 días (vencimiento E-9). `getEvent` responde 404 para estos.
        2. `pasado`: no está `sin_ver` y `end_date` es anterior al día de negocio actual.
        3. `vigente`: el resto (incluye eventos en curso y futuros).
        Un evento `pasado` todavía abre en `/e/:id` hasta que pasan 7 días sin verse.

        **Lugar y datos efectivos.** Como en `getEvent`, el lugar vinculado es el que resuelve `place_source_key`
        contra las claves de los lugares; `venue_name`, `address`, `lat` y `lon` devueltos son los del evento y, si
        faltan, los del lugar vinculado (los propios del evento tienen prioridad).

        **Faltantes (`faltan`).** Filtro de unión: devuelve los eventos a los que les falta **cualquiera** de los campos
        pedidos. `imagen`: sin `image_url`. `hora`: sin `start_time`. `precio`: `price_status = unknown`.
        `descripcion`: sin descripción o vacía. `direccion`: sin dirección efectiva. `coordenadas`: sin `lat`/`lon`
        efectivas. `lugar`: sin lugar vinculado **y** sin `venue_name`, dirección ni coordenadas efectivas (no se puede
        decir dónde es). Cada ítem trae `missing` con todos los campos que le faltan, haya o no filtro.

        **Orden fijo.** Primero `vigente`, después `pasado` y `sin_ver`; dentro de cada grupo `start_date` ascendente,
        `start_time` ascendente (sin hora al final), título normalizado e `id` como desempate final (la paginación es
        estable). No hay parámetro de orden.

        **Búsqueda (`q`).** Texto libre normalizado igual que en `searchItems` (sin tildes ni mayúsculas) sobre título,
        nombre de sede, dirección y nombre de la fuente.

        Paginación: el envelope obliga a que `data` sea el array, así que el total viaja en `X-Total-Count`, `X-Page` y
        `X-Per-Page`. Una página más allá de la última es 200 con `data: []`. El cliente que exporta todo lo filtrado
        (CSV) recorre las páginas con `per_page=100`.
      tags: [curation]
      security: []
      parameters:
        - $ref: "#/components/parameters/TextoLibre"
        - name: fuente
          in: query
          description: "Nombres de fuente primaria (`CurationEvent.source_name`, los de `listEventSources`), separados por coma. Unión. Coincidencia exacta."
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, maxLength: 100 }
            maxItems: 20
        - name: tier
          in: query
          description: "Prioridad de la fuente primaria, separada por coma. Unión."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SourceTier"
        - name: estado
          in: query
          description: "Estados, separados por coma. Unión. Sin el parámetro, todos."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EventState"
        - name: faltan
          in: query
          description: "Campos faltantes, separados por coma. Unión: al evento le falta cualquiera de ellos."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EventMissingField"
        - $ref: "#/components/parameters/CurationPage"
        - $ref: "#/components/parameters/CurationPerPage"
      responses:
        "200":
          description: Página de eventos
          headers:
            X-Total-Count:
              description: Total de eventos que cumplen los filtros (todas las páginas)
              schema: { type: integer, minimum: 0 }
            X-Page:
              schema: { type: integer, minimum: 1 }
            X-Per-Page:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CurationEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /events/sources:
    get:
      operationId: listEventSources
      summary: Fuentes primarias de eventos con su cantidad (opciones del filtro `fuente`)
      description: |
        Una fila por `source_name` presente en `events`, con la cantidad de eventos que la tienen como fuente primaria
        (todos los estados, incluidos pasados y vencidos), ordenadas por nombre. Sin paginación: son pocas (hoy 10).
        Sirve para llenar el filtro de `listEvents` sin mantener la lista de fuentes a mano en el cliente, y para ver de un
        vistazo cuántos eventos aporta cada fuente.
      tags: [curation]
      security: []
      responses:
        "200":
          description: Fuentes
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSourceCount"
        "500":
          $ref: "#/components/responses/ServerError"

  /places:
    get:
      operationId: listPlaces
      summary: Listado completo de lugares para curación
      description: |
        Alimenta `/curacion/lugares`. Devuelve **todos** los lugares cargados (los lugares no vencen), sin filtro de
        intención, ventana ni ubicación. Sin autenticación, datos ya públicos. Solo lectura. Un lugar curado sin
        `lat`/`lon` no se publica (la ingesta lo descarta, `curated_place`), así que no aparece acá.

        **Faltantes (`faltan`).** Unión: devuelve los lugares a los que les falta **cualquiera** de los campos pedidos.
        `imagen`: sin `image_url`. `horario`: sin `opening_hours` estructurado (aunque tenga `hours_text` crudo; sin
        estructura no se puede calcular «abierto ahora»). `direccion`: sin `address`. `telefono`: sin `phone`. `web`:
        sin `website`. `cocina`: `cuisine` vacío. `nota`: sin `note`. Cada ítem trae `missing` con todos los que le
        faltan, haya o no filtro.

        **Orden fijo.** Nombre normalizado ascendente e `id` como desempate final. No hay parámetro de orden.

        **Búsqueda (`q`).** Texto libre normalizado igual que en `searchItems` sobre nombre y dirección.

        Paginación y página fuera de rango: igual que `listEvents`.
      tags: [curation]
      security: []
      parameters:
        - $ref: "#/components/parameters/TextoLibre"
        - name: origen
          in: query
          description: "Origen de los datos, separado por coma. Unión."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PlaceOrigin"
        - name: tipo
          in: query
          description: "Tipo de lugar, separado por coma. Unión."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PlaceKind"
        - name: faltan
          in: query
          description: "Campos faltantes, separados por coma. Unión: al lugar le falta cualquiera de ellos."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PlaceMissingField"
        - $ref: "#/components/parameters/CurationPage"
        - $ref: "#/components/parameters/CurationPerPage"
      responses:
        "200":
          description: Página de lugares
          headers:
            X-Total-Count:
              description: Total de lugares que cumplen los filtros (todas las páginas)
              schema: { type: integer, minimum: 0 }
            X-Page:
              schema: { type: integer, minimum: 1 }
            X-Per-Page:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CurationPlace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /events/{id}:
    get:
      operationId: getEvent
      summary: Detalle de un evento
      description: |
        URL pública `/e/:id` (E-12). `lat`/`lon` opcionales para calcular distancia y minutos a pie (E-11: pueden
        ser las del pin o la zona, no necesariamente las del GPS). Un evento sin verse hace más de 7 días
        responde 404 (E-9).
      tags: [catalog]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
      responses:
        "200":
          description: Detalle del evento
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/EventDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /places/{id}:
    get:
      operationId: getPlace
      summary: Detalle de un lugar
      description: |
        URL pública `/l/:id` (E-12). Incluye los próximos eventos del lugar (lo que lo hace «sede de eventos»,
        B-1). `lat`/`lon` opcionales, igual que en `getEvent`.

        `next_change_at` dice cuándo cambia el estado abierto/cerrado (lo que la UI muestra como «cierra 23:00» o
        «abre mañana 12:00»); `upcoming_events[].end_date` permite mostrar el rango de un evento en curso.
      tags: [catalog]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
      responses:
        "200":
          description: Detalle del lugar
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/PlaceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /ingest:
    post:
      operationId: ingestBatch
      summary: Ingesta de un lote de eventos y lugares (scrapers de Python)
      description: |
        Lo llama `ingestion/` desde GitHub Actions (ADR 0002). Auth: `Authorization: Bearer <INGEST_TOKEN>`.

        **Lote parcial y solo-upsert** (cierra el pendiente del ADR 0002):
        - Es *upsert* por `source_key`, que es **único globalmente**: lleva el prefijo de la fuente
          (`<fuente>:<clave>`), así `place_source_key` no necesita otra referencia. Nunca borra ítems que el lote no
          trae: una fuente caída no vacía el catálogo. Los eventos que dejan de verse vencen a los 7 días (E-9);
          los lugares no vencen.
        - La estructura del lote se valida entera (400 si está mal). Los ítems inválidos no tumban el lote:
          se devuelven en `rejected` y el resto se guarda. Un `source_key` repetido dentro del lote se rechaza
          desde la segunda aparición (`reason: duplicate_source_key`). Es idempotente: reenviar el mismo lote no duplica.
        - Cada ítem aceptado actualiza `last_seen_at` a la hora de la request.
        - Dentro de un lote se procesan primero los lugares y después los eventos. `place_source_key` se guarda en el
          evento y se resuelve al leer, así que un evento cuyo lugar llega en un lote posterior queda vinculado solo.
        - **Hora:** `start_date` y `start_time` se envían en hora local de Rosario (UTC-3, sin horario de verano).
          El servidor guarda el instante en UTC y lo reconvierte al calcular franjas (E-5).
        - **Fechas:** un evento con `end_date` anterior a `start_date` se rechaza con `reason: invalid_date_range`.
        - **Duplicados de eventos (E-10):** dos eventos son el mismo si tienen igual título normalizado y
          `start_date`, y además comparten sede: el mismo lugar resuelto, o el `venue_name` normalizado de uno igual
          al `venue_name` o al nombre del lugar resuelto del otro, o la misma `address` normalizada. Si ninguno
          tiene sede, no se deduplica. Dos sedes del mismo show difieren en la sede, así que nunca se fusionan (E-2).
          El dedupe se evalúa al ingerir con el lugar resuelto en ese momento y no se repite después. Al fusionar,
          gana la fuente de mayor prioridad (`source.tier`: `curated` > `official` > `aggregator`); a igual
          prioridad, la que llegó primero. Las otras pasan a `sources` como «vía».
        - **Duplicados de lugares:** un lugar `origin: curated` absorbe a uno `osm` con el mismo nombre normalizado a
          50 m o menos. El `source_key` del `osm` absorbido queda como alias, para que los eventos que lo referencian
          resuelvan al lugar vigente. El dedupe de lugares se evalúa solo cuando aparece un `source_key` nuevo;
          actualizar una fila existente (por ejemplo, el curado reenviado con otro `name`, `lat` o `lon`) no dispara
          fusiones ni las revierte. Dos lugares curados nunca se fusionan entre sí: un `osm` nuevo que coincide con
          más de un curado (mismo nombre normalizado, a 50 m o menos) pasa a alias del curado insertado primero
          (orden de inserción: no depende de `id` ni del reloj; dentro de un lote, el orden de índice) y los curados
          quedan como filas aparte.
        - **Clave canónica (lugares):** tras una fusión, la clave canónica de la fila es siempre el `source_key` del
          lugar curado, sea cual sea el `id` que sobrevive (el de la fila existente, o el del `osm` insertado primero si
          hay varios). El ítem curado reemplaza la fila por completo y `origin` pasa a `curated`, también cuando el
          curado llega después del `osm`: los campos opcionales que el curado omite o manda en `null` quedan en
          `null` y no se heredan del `osm`. Así `getPlace` devuelve los datos del curado y la fila sigue absorbiendo
          `osm` posteriores a 50 m o menos. Los `source_key` `osm` pasan a alias y solo actualizan `last_seen_at`.
          Observable desde el contrato: si el curado reenvía su `source_key` con un campo cambiado, el cambio se
          aplica a la fila sobreviviente.
        - **Clave canónica (eventos):** tras una fusión, la clave canónica de la fila es el `source_key` de la fuente
          primaria (mayor `tier`; a igual `tier`, la primera en llegar), sea cual sea el `id` que sobrevive. Solo esa
          clave actualiza los campos del evento; las demás son alias y solo actualizan `last_seen_at` y `sources` (salvo el
          lugar heredado, abajo). Si después llega una fuente de mayor `tier`, pasa a ser la canónica y la anterior pasa a alias.
        - **Lugar heredado (eventos, E-10):** el `place_source_key` es la única excepción a «solo la canónica
          actualiza los campos». Cada fuente conserva el `place_source_key` que trajo (o `null`). El de la fila es el
          de la canónica si no es `null`, aunque su lugar todavía no se haya cargado; si es `null`, hereda el del alias
          de mayor `tier` que sí trae uno (a igual `tier`, el primero en llegar). Nunca pisa un `place_source_key` que
          la canónica ya tiene: gana la canónica. Se recalcula en cada ingesta que toca la fila, también cuando llega
          un alias, y es lo que usa `getEvent` para resolver `place`. No dispara fusiones nuevas: el dedupe sigue
          evaluándose solo al ingerir un `source_key` nuevo, pero la clave heredada sí cuenta como sede de la fila
          para los ítems nuevos que lleguen después, también dentro del mismo lote. Una fuente que reenvía su `source_key` sin
          `place_source_key` deja de aportarlo.
        - **Mismo lote:** los ítems ya procesados del mismo lote cuentan como filas existentes, en orden de índice,
          tanto para el dedupe como para «Varios candidatos». Los conteos siguen las mismas reglas (`created` para
          el primero, `updated` para cada fusión).
        - **Varios candidatos:** si un ítem nuevo coincide con más de una fila existente (lugares, solo cuando el ítem
          nuevo es curado: dos filas `osm`, por ejemplo nodo y way, a 50 m o menos; eventos: el criterio de sede no es transitivo), se fusionan
          todos en la fila insertada primero (mismo orden de inserción de arriba). Las demás pasan a alias que
          resuelven a ella, y la fusión cuenta como un solo `updated`.
        - **Ids estables:** al fusionar, la fila ya existente conserva su `id` y los ids absorbidos resuelven al
          vigente, así los links `/e/:id` y `/l/:id` ya compartidos (E-12) no pasan a 404. Un `source_key` que ya es
          alias solo actualiza `last_seen_at`; nunca pisa los campos del lugar curado (E-10). Lo mismo vale para eventos: el `source_key` de un evento absorbido en una fusión solo actualiza `last_seen_at` y su entrada en `sources`, nunca los campos de la primaria (salvo el lugar heredado, arriba), y reenviarlo no crea un evento nuevo.
        - **Conteos:** una fusión por dedupe cuenta como `updated`.
        - Un evento con varias sedes se envía como un ítem por sede, con el mismo `source_url` (E-2).
        - Máximo 200 eventos y 200 lugares por lote. Presupuesto: las escrituras van con `D1.batch()` y una request
          hace como máximo 10 llamadas a la API de D1 (`batch`, `run`, `all`), sea cual sea el tamaño del lote.
      tags: [ingest]
      security:
        - ingestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatch"
      responses:
        "200":
          description: Lote procesado (puede incluir ítems rechazados)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/IngestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    ingestToken:
      type: http
      scheme: bearer
      description: "`INGEST_TOKEN` (Wrangler Secret en el Worker, GH Actions Secret en el runner). Solo para `/ingest`."

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Intents:
      name: i
      in: query
      description: "Intenciones, separadas por coma. Unión (cualquiera), ordenada por cantidad de coincidencias (E-7); con `musica_en_vivo` o `bailar` y `musica` activos el resultado se restringe a eventos de esos géneros (ver `musica`)."
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Intent"
    MusicGenres:
      name: musica
      in: query
      description: "Subtipos de música, por coma. Con `musica_en_vivo` o `bailar` en `i` (F-17), el resultado queda restringido a eventos que tengan alguno de esos géneros (`music_genres`) y coincidan con al menos una intención de `i`; basta el género, no hace falta que el evento tenga `musica_en_vivo` ni `bailar` en sus `intents`, pero el género no cuenta como coincidencia de intención (ni para el orden de E-7). Los lugares (no tienen géneros) y los eventos sin esos géneros quedan fuera. Sin `musica_en_vivo` ni `bailar` en `i` se ignoran."
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/MusicGenre"
    Gratis:
      name: gratis
      in: query
      description: "`true` trae solo `price_status = free` (E-6). Los lugares no tienen precio: su `price_status` es siempre `unknown`, así que `gratis=true` los excluye."
      schema: { type: boolean }
    Cuando:
      name: cuando
      in: query
      description: "Ventana. `fecha` exige el parámetro `fecha`."
      schema:
        type: string
        enum: [ahora, hoy, manana, finde, fecha]
        default: hoy
    Fecha:
      name: fecha
      in: query
      description: "Día puntual (`cuando=fecha`; con otro `cuando` se ignora). Una fecha anterior al día de negocio actual es 400; igual a hoy se comporta como `hoy` (recortada a `ahora`); posterior, el día entero."
      schema: { type: string, format: date }
    Zona:
      name: z
      in: query
      description: "Id de una zona de `/zones`. Excluyente con `lat`/`lon`."
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
    Lat:
      name: lat
      in: query
      description: "Origen: latitud (GPS o pin del mapa). Va con `lon`."
      schema: { type: number, format: double, minimum: -90, maximum: 90 }
    Lon:
      name: lon
      in: query
      schema: { type: number, format: double, minimum: -180, maximum: 180 }
    RadioM:
      name: radio_m
      in: query
      description: "Radio en metros alrededor de `lat`/`lon`. Si se envía `z` se ignora: la zona usa su propio radio (E-8)."
      schema: { type: integer, minimum: 500, maximum: 10000, default: 2000 }
    TextoLibre:
      name: q
      in: query
      description: "Texto libre sobre título, lugar y dirección."
      schema: { type: string, maxLength: 100 }

    CurationPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    CurationPerPage:
      name: per_page
      in: query
      description: "Filas por página. Default 50 (el listado de curación); máximo 100."
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  schemas:
    HealthData:
      type: object
      required: [status, ts]
      properties:
        status:
          type: string
          enum: [ok]
        ts:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

    Intent:
      type: string
      enum: [comer, tomar_algo, espectaculo, musica_en_vivo, bailar, con_chicos]
      description: Taxonomía de intenciones (B-3). La asigna la ingesta, no el cliente.

    MusicGenre:
      type: string
      enum: [jazz, rock, folklore, electronica, tango, cumbia, clasica, chamame]
      description: Subgénero de música (B-3, F-17). Lo asigna la ingesta. Un evento puede tener varios.

    Band:
      type: string
      enum: [ahora, hoy, esta_noche, manana, proximos, en_cartel, a_confirmar]
      description: |
        Franja de la lista (B-9), en America/Argentina/Buenos_Aires (E-5). Reglas completas en la descripción de `searchItems`.
        `ahora`: empezó hace hasta 2 h o empieza en la próxima hora (lugares: abierto ahora).
        `hoy`: hoy entre 06:00 y 20:00. `esta_noche`: desde las 20:00 hasta las 06:00.
        `manana`: el día siguiente. `proximos`: días posteriores a mañana.
        `en_cartel`: rango de más de 7 días (E-3). `a_confirmar`: sin horario (E-4).

    ItemKind:
      type: string
      enum: [event, place]

    PriceStatus:
      type: string
      enum: [free, paid, unknown]
      description: E-6. `unknown` = «precio no informado», sin etiqueta.

    PlaceKind:
      type: string
      enum: [restaurante, bar, cafe, heladeria, comida_rapida, sala, otro]

    PlaceOffer:
      type: string
      enum: [musica_en_vivo, cena, baile]

    PlaceOrigin:
      type: string
      enum: [curated, osm]

    SourceTier:
      type: string
      enum: [curated, official, aggregator]
      description: Prioridad de fuente para resolver duplicados (E-10), de mayor a menor.

    Zone:
      type: object
      required: [id, name, kind, lat, lon, radius_m]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9-]+$'
          description: Slug estable, el que va en `?z=` (E-12), ej. `pichincha`.
        name:
          type: string
        kind:
          type: string
          enum: [barrio, localidad]
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        radius_m:
          type: integer
          minimum: 100

    SourceLink:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri

    OpeningPeriod:
      type: object
      required: [day, opens, closes]
      properties:
        day:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = lunes, 6 = domingo
        opens:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        closes:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Si es menor que `opens`, cierra al día siguiente. Si es igual a `opens`, el lugar está abierto 24 h (ej. `00:00`–`00:00`).

    SearchItem:
      type: object
      required: [kind, id, title, intents, band, place_kind, start_date, end_date, start_time, open_now, venue_name, address, lat, lon, location_known, distance_m, walk_minutes, price_status, price_from_ars, image_url]
      description: Todas las claves se devuelven siempre; «no aplica» o «no informado» es `null`, nunca una clave ausente.
      properties:
        kind:
          $ref: "#/components/schemas/ItemKind"
        id:
          type: string
          format: uuid
        title:
          type: string
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        band:
          $ref: "#/components/schemas/Band"
        place_kind:
          description: Solo `kind = place`.
          oneOf:
            - $ref: "#/components/schemas/PlaceKind"
            - type: "null"
        start_date:
          type: [string, "null"]
          format: date
          description: Solo `kind = event`.
        end_date:
          type: [string, "null"]
          format: date
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
          description: Hora local de 24 h. `null` = «horario no informado».
        open_now:
          type: [boolean, "null"]
          description: Solo `kind = place`. `null` = «horario no informado».
        venue_name:
          type: [string, "null"]
        address:
          type: [string, "null"]
        lat:
          type: [number, "null"]
          format: double
        lon:
          type: [number, "null"]
          format: double
        location_known:
          type: boolean
          description: "`false` = «ubicación no informada» (E-1): no hay distancia ni pin."
        distance_m:
          type: [integer, "null"]
          description: Desde el origen de la búsqueda (E-11). `null` si no hay origen o `location_known = false`.
        walk_minutes:
          type: [integer, "null"]
          description: Estimación en línea recta a 80 m/min (B-8).
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        price_from_ars:
          type: [integer, "null"]
          minimum: 0
        image_url:
          type: [string, "null"]
          format: uri

    SearchPin:
      type: object
      required: [kind, id, title, lat, lon]
      properties:
        kind:
          $ref: "#/components/schemas/ItemKind"
        id:
          type: string
          format: uuid
        title:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double

    TimeOfDay:
      type: [string, "null"]
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Hora local de 24 h (`HH:MM`). `null` = «horario no informado».

    EventSibling:
      type: object
      required: [id]
      description: Mismo evento en otra sede (E-2). `id` es el del evento hermano (`/e/:id`).
      properties:
        id:
          type: string
          format: uuid
        venue_name:
          type: [string, "null"]
        address:
          type: [string, "null"]

    PlaceRef:
      type: object
      required: [id, name]
      description: "Lugar vinculado. `id` es el del lugar (`/l/:id`)."
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: [string, "null"]

    EventDetail:
      type: object
      required: [id, title, description, intents, music_genres, start_date, end_date, start_time, date_text, venue_name, address, lat, lon, location_known, distance_m, walk_minutes, place, price_status, price_from_ars, image_url, sources, also_at, last_seen_at, is_stale]
      description: Todas las claves se devuelven siempre; «no informado» es `null`, nunca una clave ausente.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        music_genres:
          type: array
          items:
            $ref: "#/components/schemas/MusicGenre"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
        date_text:
          type: [string, "null"]
          description: Texto original de la fuente, para mostrar cuando el parseo no alcanza.
        venue_name:
          type: [string, "null"]
        address:
          type: [string, "null"]
        lat:
          type: [number, "null"]
          format: double
        lon:
          type: [number, "null"]
          format: double
        location_known:
          type: boolean
        distance_m:
          type: [integer, "null"]
        walk_minutes:
          type: [integer, "null"]
        place:
          description: Lugar vinculado, si la ingesta lo resolvió (hereda sus coordenadas, E-1).
          oneOf:
            - $ref: "#/components/schemas/PlaceRef"
            - type: "null"
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        price_from_ars:
          type: [integer, "null"]
          minimum: 0
        image_url:
          type: [string, "null"]
          format: uri
        sources:
          type: array
          minItems: 1
          description: La primera es la fuente primaria; las demás son «vía» (D-10, link siempre visible).
          items:
            $ref: "#/components/schemas/SourceLink"
        also_at:
          type: array
          description: "Eventos hermanos (E-2), «También en…»: los que comparten cualquiera de los `source_url` recibidos por sus `source_key` (primario o alias) **y** el título normalizado, y están en otra sede (distinto lugar vinculado, o distinto `venue_name`/`address` normalizado). Dos eventos con el mismo título en la misma sede no son hermanos. El agrupado se conserva aunque un dedupe cambie la fuente primaria. Excluye eventos vencidos (E-9)."
          items:
            $ref: "#/components/schemas/EventSibling"
        last_seen_at:
          type: string
          format: date-time
        is_stale:
          type: boolean
          description: "`true` si `last_seen_at` tiene más de 36 h (E-9): el Detalle avisa «datos de ayer»."

    UpcomingEvent:
      type: object
      required: [id, title, start_date, end_date, start_time, price_status, price_from_ars]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        start_date:
          type: string
          format: date
          description: Inicio del rango del evento, no la próxima ocurrencia; un evento en curso trae una fecha ya pasada.
        end_date:
          type: string
          format: date
          description: Fin del rango. Igual a `start_date` en un evento de un solo día; la UI muestra el rango cuando difieren.
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        price_from_ars:
          type: [integer, "null"]
          minimum: 0

    PlaceDetail:
      type: object
      required: [id, name, kind, origin, intents, offers, cuisine, address, lat, lon, location_known, distance_m, walk_minutes, opening_hours, hours_text, open_now, next_change_at, phone, website, instagram, outdoor, note, image_url, upcoming_events, last_seen_at]
      description: Todas las claves se devuelven siempre; «no informado» es `null`, nunca una clave ausente.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/PlaceKind"
        origin:
          $ref: "#/components/schemas/PlaceOrigin"
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/PlaceOffer"
        cuisine:
          type: array
          description: Tipos de cocina en español; la ingesta traduce los de OpenStreetMap (`coffee shop` → `café`) y un valor sin traducción conocida se conserva tal cual.
          items:
            type: string
        address:
          type: [string, "null"]
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        location_known:
          type: boolean
          enum: [true]
          description: Un lugar siempre tiene coordenadas.
        distance_m:
          type: [integer, "null"]
        walk_minutes:
          type: [integer, "null"]
        opening_hours:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/OpeningPeriod"
        hours_text:
          type: [string, "null"]
          description: Horario crudo de la fuente (OSM `opening_hours`), por si no se pudo estructurar.
        open_now:
          type: [boolean, "null"]
        next_change_at:
          type: [string, "null"]
          format: date-time
          description: |
            Primer instante posterior a «ahora» en que `open_now` cambia de valor: el cierre si está abierto, la próxima
            apertura si está cerrado. Se calcula sobre `opening_hours` fusionando los tramos contiguos o superpuestos
            (12:00–16:00 y 16:00–23:00 son un solo tramo abierto) y mira hasta 8 días adelante: si no hay un cambio
            antes de «ahora + 8 días» es `null`, lo que incluye al lugar que abre las 24 h todos los días y a
            `opening_hours` `null` (`open_now` también).
        phone:
          type: [string, "null"]
        website:
          type: [string, "null"]
          format: uri
        instagram:
          type: [string, "null"]
          description: Usuario sin @.
        outdoor:
          type: [boolean, "null"]
        note:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
          format: uri
        upcoming_events:
          type: array
          description: Próximos eventos en este lugar, más cercanos primero, máximo 20. Excluye los que ya pasaron y los vencidos (E-9).
          maxItems: 20
          items:
            $ref: "#/components/schemas/UpcomingEvent"
        last_seen_at:
          type: string
          format: date-time
          description: Informativo. Los lugares no vencen ni tienen aviso de «datos de ayer».

    EventState:
      type: string
      enum: [vigente, pasado, sin_ver]
      description: "Estado de un evento en el listado de curación. Reglas y precedencia en la descripción de `listEvents`: `sin_ver` (más de 7 días sin verse), `pasado` (`end_date` anterior al día de negocio) y `vigente`."

    EventMissingField:
      type: string
      enum: [imagen, lugar, hora, precio, descripcion, direccion, coordenadas]
      description: Campo faltante de un evento. Definiciones en la descripción de `listEvents`.

    PlaceMissingField:
      type: string
      enum: [imagen, horario, direccion, telefono, web, cocina, nota]
      description: Campo faltante de un lugar. Definiciones en la descripción de `listPlaces`.

    EventSourceCount:
      type: object
      required: [name, tier, count]
      properties:
        name:
          type: string
          description: Valor de `source_name`, el que acepta el filtro `fuente`.
        tier:
          $ref: "#/components/schemas/SourceTier"
        count:
          type: integer
          minimum: 1

    CurationEvent:
      type: object
      required: [id, title, description, intents, music_genres, estado, start_date, end_date, start_time, date_text, venue_name, address, lat, lon, place, price_status, price_from_ars, image_url, source_name, source_tier, sources, last_seen_at, missing]
      description: Todas las claves se devuelven siempre; «no informado» es `null`, nunca una clave ausente.
      properties:
        id:
          type: string
          format: uuid
          description: Abre en `/e/:id` mientras el evento no esté `sin_ver`.
        title:
          type: string
        description:
          type: [string, "null"]
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        music_genres:
          type: array
          items:
            $ref: "#/components/schemas/MusicGenre"
        estado:
          $ref: "#/components/schemas/EventState"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
        date_text:
          type: [string, "null"]
          description: Texto original de la fuente.
        venue_name:
          type: [string, "null"]
          description: El del evento o, si falta, el del lugar vinculado.
        address:
          type: [string, "null"]
          description: La del evento o, si falta, la del lugar vinculado.
        lat:
          type: [number, "null"]
          format: double
          description: La del evento o, si falta, la del lugar vinculado.
        lon:
          type: [number, "null"]
          format: double
        place:
          description: Lugar vinculado por la ingesta, si lo resolvió.
          oneOf:
            - $ref: "#/components/schemas/PlaceRef"
            - type: "null"
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        price_from_ars:
          type: [integer, "null"]
          minimum: 0
        image_url:
          type: [string, "null"]
          format: uri
        source_name:
          type: string
          description: Fuente primaria (la misma que `sources[0].name`).
        source_tier:
          $ref: "#/components/schemas/SourceTier"
        sources:
          type: array
          minItems: 1
          description: Misma regla que `EventDetail.sources`. La primera es la fuente primaria; el resto son las vías (`sources.length - 1`).
          items:
            $ref: "#/components/schemas/SourceLink"
        last_seen_at:
          type: string
          format: date-time
        missing:
          type: array
          description: Todos los campos faltantes del evento, en el orden de `EventMissingField`.
          items:
            $ref: "#/components/schemas/EventMissingField"

    CurationPlace:
      type: object
      required: [id, name, kind, origin, intents, offers, cuisine, address, lat, lon, has_opening_hours, hours_text, phone, website, instagram, outdoor, note, image_url, last_seen_at, missing]
      description: Todas las claves se devuelven siempre; «no informado» es `null`, nunca una clave ausente.
      properties:
        id:
          type: string
          format: uuid
          description: Abre en `/l/:id`.
        name:
          type: string
        kind:
          $ref: "#/components/schemas/PlaceKind"
        origin:
          $ref: "#/components/schemas/PlaceOrigin"
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/PlaceOffer"
        cuisine:
          type: array
          items:
            type: string
        address:
          type: [string, "null"]
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        has_opening_hours:
          type: boolean
          description: "`true` si hay `opening_hours` estructurado (el detalle público puede decir si está abierto). El detalle de los períodos queda en `getPlace`."
        hours_text:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        website:
          type: [string, "null"]
          format: uri
        instagram:
          type: [string, "null"]
          description: Usuario sin @.
        outdoor:
          type: [boolean, "null"]
        note:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
          format: uri
        last_seen_at:
          type: string
          format: date-time
        missing:
          type: array
          description: Todos los campos faltantes del lugar, en el orden de `PlaceMissingField`.
          items:
            $ref: "#/components/schemas/PlaceMissingField"

    IngestBatch:
      type: object
      required: [source, generated_at]
      properties:
        source:
          type: object
          required: [name, tier]
          properties:
            name:
              type: string
              description: Nombre de la fuente, ej. `Agenda municipal`, `OpenStreetMap`.
            tier:
              $ref: "#/components/schemas/SourceTier"
        generated_at:
          type: string
          format: date-time
        events:
          type: array
          maxItems: 200
          description: >-
            Cada ítem se valida por separado contra `IngestEvent`; uno inválido va a `rejected` y no tumba el lote.
            Por eso el lote solo exige que cada ítem sea un objeto.
          items:
            anyOf:
              - $ref: "#/components/schemas/IngestEvent"
              - type: object
                additionalProperties: true
        places:
          type: array
          maxItems: 200
          description: >-
            Cada ítem se valida por separado contra `IngestPlace`; uno inválido va a `rejected` y no tumba el lote.
          items:
            anyOf:
              - $ref: "#/components/schemas/IngestPlace"
              - type: object
                additionalProperties: true

    IngestEvent:
      type: object
      required: [source_key, title, intents, start_date, end_date, price_status, source_url]
      properties:
        source_key:
          type: string
          minLength: 1
          description: "Único globalmente: `<fuente>:<clave estable por URL + sede>`. Es la clave del upsert."
        title:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        music_genres:
          type: array
          items:
            $ref: "#/components/schemas/MusicGenre"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        start_time:
          $ref: "#/components/schemas/TimeOfDay"
          description: Hora local de Rosario. `null` si la fuente no la informa (E-4).
        date_text:
          type: [string, "null"]
        venue_name:
          type: [string, "null"]
        address:
          type: [string, "null"]
        lat:
          type: [number, "null"]
          format: double
        lon:
          type: [number, "null"]
          format: double
        place_source_key:
          type: [string, "null"]
          description: "`source_key` (global) del lugar vinculado, de cualquier fuente. Si el lugar todavía no existe, el evento queda sin lugar hasta que llegue (se resuelve al leer)."
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        price_from_ars:
          type: [integer, "null"]
          minimum: 0
        image_url:
          type: [string, "null"]
          format: uri
        source_url:
          type: string
          format: uri
          description: URL de la fuente primaria. El nombre y la prioridad salen del lote (`source`). Es también la clave de agrupado de sedes (E-2).
        via:
          type: array
          description: Otras fuentes que mencionan el evento («vía»), si la ingesta las conoce.
          items:
            $ref: "#/components/schemas/SourceLink"

    IngestPlace:
      type: object
      required: [source_key, name, kind, origin, intents, lat, lon]
      properties:
        source_key:
          type: string
          minLength: 1
          description: "Único globalmente: `<fuente>:<id>` (OSM: `osm:w1225024480`)."
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/PlaceKind"
        origin:
          $ref: "#/components/schemas/PlaceOrigin"
        intents:
          type: array
          items:
            $ref: "#/components/schemas/Intent"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/PlaceOffer"
        cuisine:
          type: array
          description: Tipos de cocina en español; la ingesta traduce los de OpenStreetMap (`coffee shop` → `café`) y un valor sin traducción conocida se conserva tal cual.
          items:
            type: string
        address:
          type: [string, "null"]
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        opening_hours:
          type: [array, "null"]
          description: >-
            Horario estructurado por la ingesta. `null` = «horario no informado». Un array vacío es inválido
            (`reason: invalid_opening_hours`): si no se pudo estructurar, enviar `null`.
          minItems: 1
          items:
            $ref: "#/components/schemas/OpeningPeriod"
        hours_text:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        website:
          type: [string, "null"]
          format: uri
        instagram:
          type: [string, "null"]
        outdoor:
          type: [boolean, "null"]
        note:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
          format: uri

    IngestCounts:
      type: object
      required: [received, created, updated, rejected]
      properties:
        received:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        rejected:
          type: integer

    IngestRejection:
      type: object
      required: [kind, index, source_key, reason]
      properties:
        kind:
          $ref: "#/components/schemas/ItemKind"
        index:
          type: integer
          minimum: 0
        source_key:
          type: [string, "null"]
        reason:
          type: string

    IngestResult:
      type: object
      required: [events, places, rejected]
      properties:
        events:
          $ref: "#/components/schemas/IngestCounts"
        places:
          $ref: "#/components/schemas/IngestCounts"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/IngestRejection"

  responses:
    BadRequest:
      description: Request inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Falta el token o es inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
